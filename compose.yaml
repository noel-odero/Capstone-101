name: stewardlab

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Amr: Host=postgres;Port=5432;Database=amr;Username=amr;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PythonService__BaseUrl: http://model:8000
  DataProtection__KeysPath: /var/lib/amr/keys
  ReverseProxy__KnownProxy: 172.30.72.10
  AllowedHosts: ${DOMAIN:?Set DOMAIN in .env}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: amr
      POSTGRES_DB: amr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  model:
    build:
      context: .
      dockerfile: deploy/model.Dockerfile
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/internal/health', timeout=3))['model_ready']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api:
    image: stewardlab-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment: *api-environment
    volumes:
      - api-keys:/var/lib/amr/keys
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 5 --header "Host: $${AllowedHosts}" http://127.0.0.1:8080/api/v1/health']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.72.10
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: stewardlab-api:${IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: [/app/efbundle]
    environment: *api-environment
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.72.0/24
  backend:
    internal: true

volumes:
  postgres-data:
  api-keys:
  caddy-data:
  caddy-config:
