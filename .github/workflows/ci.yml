name: CI

on:
  pull_request:
  push:
    branches: [main, backend]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Directory.Build.props switches NuGet to locked mode when CI is true; the restore steps also pass --locked-mode.
  CI: true

jobs:
  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database on the job's private network; no password exists to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AMR_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Database=postgres
      # A missing or unreachable database fails the database tests instead of skipping them.
      AMR_REQUIRE_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore (locked mode)
        working-directory: backend
        run: dotnet restore Amr.sln --locked-mode

      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build Amr.sln --no-restore -warnaserror

      # The live tests need a running Python service and are run by the live job, so they are not repeated here.
      - name: Unit and integration tests
        working-directory: backend
        run: dotnet test Amr.sln --no-build --filter "FullyQualifiedName!~LivePythonServiceTests&FullyQualifiedName!~LiveEndToEndTests"

  python:
    name: Python tests
    # Match the pinned research environment used to train and audit the frozen policies.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml/requirements-lock.txt
            service/requirements.txt
            service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r ml/requirements-lock.txt -r service/requirements-dev.txt

      - name: Run the Python test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider

  live:
    name: Live Python service and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AMR_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: service/requirements.txt

      - name: Install the Python service
        run: python -m pip install -r service/requirements.txt

      # Starts the real service, waits for a ready model, then runs only the live test classes with skipping disabled.
      - name: Live tests
        shell: pwsh
        run: ./backend/scripts/run-live-tests.ps1 -Python python

      - name: Python service log
        if: failure()
        run: tail -n 100 "${TMPDIR:-/tmp}"/amr-python-service-8011.log* || true
